<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login</title><link rel="stylesheet" href="/styles.css"></head><body class="center"><div class="auth card"><a href="/" class="back">← Home</a><h1>Welcome back</h1><p>Log in to your member dashboard.</p><form id="f"><label>Email<input type="email" name="email" required></label><label>Password<input type="password" name="password" required></label><button class="btn">Login</button><div id="msg"></div></form><p>New member? <a href="/register.html">Create an account</a></p></div><script>
f.onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(f)))});let j=await r.json();if(j.ok)location='/dashboard.html';else msg.textContent=j.error};
</script></body></html>
