<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><link rel="stylesheet" href="/styles.css"></head><body><header class="top"><div class="brand">🛠 Admin Backend</div><button id="logout" class="linkbtn">Logout</button></header><main class="dash"><div id="loginBox" class="card auth"><h1>Admin login</h1><form id="lf"><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" required></label><button class="btn">Login</button><p id="msg"></p></form></div><div id="panel" style="display:none"><div class="grid four" id="stats"></div><div class="grid two"><section class="card"><h2>Pending Legend Upgrades</h2><div id="upgrades"></div></section><section class="card"><h2>Pending Withdrawals</h2><div id="withdrawals"></div></section></div><section class="card"><h2>Publish Daily News</h2><form id="nf" class="grid two"><label>Title<input name="title" required></label><label>Category<input name="category" required value="Nigeria"></label><label>Publish date<input type="date" name="publishDate" required></label><label>Body<textarea name="body" required></textarea></label><button class="btn">Publish</button></form></section><section class="card"><h2>Users</h2><div id="users"></div></section></div></main><script>
async function api(url,opt={}){let r=await fetch(url,opt);let j=await r.json();if(!r.ok)throw new Error(j.error||'Error');return j}
async function init(){try{await refresh()}catch(e){loginBox.style.display='block';panel.style.display='none'}}
async function refresh(){let s=await api('/api/admin/stats');loginBox.style.display='none';panel.style.display='block';stats.innerHTML=`<div class="stat"><span>Users</span><strong>${s.users}</strong></div><div class="stat"><span>Legend</span><strong>${s.legend}</strong></div><div class="stat"><span>Pending upgrades</span><strong>${s.pendingUpgrades}</strong></div><div class="stat"><span>Pending withdrawals</span><strong>${s.pendingWithdrawals}</strong></div>`;let [u,w,us]=await Promise.all([api('/api/admin/upgrades'),api('/api/admin/withdrawals'),api('/api/admin/users')]);upgrades.innerHTML=u.map(x=>`<div class="row"><b>${x.name}</b><span>₦${x.amount.toLocaleString()} • ${x.reference||'no ref'}</span><button onclick="review('upgrades',${x.id},'approve')">Approve</button><button onclick="review('upgrades',${x.id},'reject')">Reject</button></div>`).join('')||'<p>None</p>';withdrawals.innerHTML=w.filter(x=>x.status==='pending').map(x=>`<div class="row"><b>${x.name}</b><span>₦${x.amount.toLocaleString()} • ${x.bank_name} • ${x.account_number}</span><button onclick="review('withdrawals',${x.id},'approve')">Approve</button><button onclick="review('withdrawals',${x.id},'reject')">Reject</button></div>`).join('')||'<p>None</p>';users.innerHTML='<div class="table">'+us.map(x=>`<div><b>${x.name}</b><span>${x.email}</span><span>${x.plan}</span><span>₦${x.balance.toLocaleString()}</span><span>${x.referral_code}</span></div>`).join('')+'</div>'}
async function review(type,id,action){await api(`/api/admin/${type}/${id}/${action}`,{method:'POST'});refresh()}
lf.onsubmit=async e=>{e.preventDefault();try{await api('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(lf)))});refresh()}catch(e){msg.textContent=e.message}}
nf.onsubmit=async e=>{e.preventDefault();await api('/api/admin/news',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(nf)))});alert('News published');nf.reset();refresh()}
logout.onclick=async()=>{await api('/api/admin/logout',{method:'POST'});location.reload()}
init();
</script></body></html>
