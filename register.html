<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register</title><link rel="stylesheet" href="/styles.css"></head><body class="center"><div class="auth card"><a href="/" class="back">← Home</a><h1>Create account</h1><p>Join the daily Nigeria news rewards platform.</p><form id="f"><label>Full name<input name="name" required></label><label>Phone number<input name="phone" required></label><label>Email<input type="email" name="email" required></label><label>Password<input type="password" name="password" minlength="6" required></label><label>Referral code (optional)<input name="referralCode"></label><label class="check"><input type="checkbox" required> I agree to the promotional rewards terms.</label><button class="btn">Register</button><div id="msg"></div></form><p>Already registered? <a href="/login.html">Login</a></p></div><script>
f.onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(f));delete d.undefined;let r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});let j=await r.json();if(j.ok)location='/dashboard.html';else msg.textContent=j.error};
</script></body></html>
